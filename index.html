<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traffic Safety & Collision Hotspots</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 90vh; }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        .legend div { margin-bottom: 5px; }
        .legend span {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Map</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="map"></div>
        <div class="legend">
            <h4>Collision Severity</h4>
            <div><span style="background:red;"></span> High</div>
            <div><span style="background:orange;"></span> Medium</div>
            <div><span style="background:yellow;"></span> Low</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Traffic Safety Project | Hosted on GitHub Pages</p>
    </footer>

    <!-- JS Files -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
